name: Build Backend Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: podman

    steps:
      - uses: actions/checkout@v4

      - run: podman --version

      - run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
          podman login main-pc-1.taildccbd1.ts.net:9001 \
          --username "${{ secrets.REGISTRY_USERNAME }}" \
          --password-stdin

      - run: |
          SHORT_SHA=$(echo "${{ forgejo.sha }}" | cut -c1-7)

          podman build \
            -f Containerfile \
            -t main-pc-1.taildccbd1.ts.net:9001/lewin/ppklj-backend:dev \
            -t main-pc-1.taildccbd1.ts.net:9001/lewin/ppklj-backend:$SHORT_SHA \
            .

          podman push main-pc-1.taildccbd1.ts.net:9001/lewin/ppklj-backend:dev
          podman push main-pc-1.taildccbd1.ts.net:9001/lewin/ppklj-backend:$SHORT_SHA
