name: Build Backend Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: docker

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Check Containerfile
        run: |
          ls -la
          test -f Containerfile

      - name: Build image
        run: |
          docker build \
            -f Containerfile \
            -t ppklj-backend:ci \
            .
