name: Build Backend Image

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: podman

    steps:
      - uses: actions/checkout@v4

      - run: podman --version

      - run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
          podman login git.lewinxander.com \
          --username "${{ secrets.REGISTRY_USERNAME }}" \
          --password-stdin

      - run: |
          SHORT_SHA=$(echo "${{ forgejo.sha }}" | cut -c1-7)

          podman build \
            -f Containerfile \
            -t git.lewinxander.com/lewin/ppklj-backend:dev \
            -t git.lewinxander.com/lewin/ppklj-backend:$SHORT_SHA \
            .

          podman push git.lewinxander.com/lewin/ppklj-backend:dev
          podman push git.lewinxander.com/lewin/ppklj-backend:$SHORT_SHA
